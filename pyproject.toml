# Single tooling config for backend/, mcp-server/, scripts/, training/ (run from the repository root; see Makefile)
[tool.black]
line-length = 140
target-version = ["py310"]
skip-magic-trailing-comma = true
extend-exclude = "migrations/versions"

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["backend/app/database/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF012", "RUF001", "RUF002", "RUF003", "SIM108", "SIM102", "SIM105", "B905", "E731", "UP042", "RUF005", "RUF015", "RUF100", "UP031", "B007"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tools"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["E402", "F401", "B017", "RUF059", "SIM117", "I001"]
"backend/app/database/migrations/env.py" = ["E402"]
"scripts/*" = ["E402", "I001"]
"training/*" = ["E402"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
mypy_path = "backend"
explicit_package_bases = true
exclude = ["migrations/versions", "tests"]
